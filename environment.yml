name: c2g_cpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python Core
  - python=3.10

  # PyTorch & PyTorch Geometric (CPU build, tối ưu AMD Ryzen)
  - pytorch=2.1.2
  - torchvision
  - torchaudio
  - cpuonly
  - pyg=2.4.0

  # Ngăn xếp Địa không gian & GIS (C-extensions)
  - geopandas>=0.14.0
  - shapely>=2.0.0
  - pyproj>=3.6.0
  - fiona>=1.9.0
  - pyogrio>=0.7.0
  - rtree>=1.0.0

  # Lưới không gian & Phân tích mạng lưới
  - h3-py>=3.7.6
  - networkx>=3.1

  # Khoa học tính toán & Học máy
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - hdbscan>=0.8.33
  - joblib>=1.3.0

  # Định dạng lưu trữ dữ liệu
  - pyarrow>=14.0.0
  - fastparquet>=2023.10.0
  - pyyaml>=6.0

  # Đồ họa & Bản đồ chuyên đề
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - contextily>=1.5.0
  - tqdm>=4.66.0

  # Gói cài bổ sung qua Pip nội bộ môi trường
  - pip
  - pip:
      - matplotlib-scalebar>=0.8.1
      - cmcrameri>=1.8.0
